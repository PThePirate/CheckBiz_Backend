server:
  port: ${PORT:4000}

spring:
  application:
    name: checkbiz-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/checkbiz_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:checkbiz_dev_pw}

  jpa:
    hibernate:
      # 'validate': el esquema real vive en Flyway (V1__init.sql, el SQL ya
      # validado). Hibernate solo confirma que las entidades coinciden con
      # las tablas — nunca genera ni altera el esquema por su cuenta.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # SMTP para el envío real de correo (Gmail, Outlook, o cualquier
  # proveedor estándar). El host tiene un valor por defecto (Gmail) para
  # que Spring Boot siempre pueda crear el bean JavaMailSender, incluso sin
  # configurar nada — checkbiz.email.habilitado es lo que de verdad decide
  # si se intenta enviar un correo real o no (ver EmailService.kt).
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

checkbiz:
  jwt:
    secret: ${JWT_SECRET:600452}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 días
  otp:
    dev-mode: ${OTP_DEV_MODE:true}
  email:
    from: ${EMAIL_FROM:}
    habilitado: ${EMAIL_HABILITADO:false}
  uploads:
    dir: ${UPLOADS_DIR:uploads}

logging:
  level:
    com.checkbiz.backend: INFO
    org.hibernate.SQL: WARN